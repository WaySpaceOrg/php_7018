<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณ BMI</title>
    <style>
        :root{--blue:#79afea;--dark:#315f9e;--text:#40516f}
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;padding:24px 16px 42px;color:var(--text);font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#edf7ff,#dceeff 55%,#f7fbff);line-height:1.7}
        .container{width:min(100%,700px);margin:0 auto}
        .back-row{display:block;margin-bottom:18px}
        .back-link{display:inline-block;padding:9px 16px;background:#fff;color:var(--dark);border:1px solid #c6ddfa;border-radius:30px;text-decoration:none;font-weight:bold;box-shadow:0 5px 15px #5b8bc21a}
        .back-link:hover{background:var(--blue);color:#fff}
        .bmi-card{background:#ffffffed;border:1px solid #d9eaff;border-radius:22px;padding:24px;box-shadow:0 12px 30px #5b8bc21f}
        h1{margin:0 0 22px;color:var(--dark);font-size:clamp(26px,5vw,36px)}
        .field{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
        label{font-weight:bold;color:var(--dark)}
        input{width:100%;padding:11px 13px;border:1px solid #c6ddfa;border-radius:11px;background:#fff;color:var(--text);font:inherit}
        button{padding:10px 22px;border:0;border-radius:24px;background:var(--blue);color:#fff;font:inherit;font-weight:bold;cursor:pointer}
        button:hover{background:var(--dark)}
        #result{margin-top:18px;padding:12px;border-radius:12px;background:#f1f7ff;color:var(--dark);font-weight:bold}
        @media(max-width:600px){body{padding:16px 11px 30px}.bmi-card{padding:18px}}
    
/* ปุ่มกลับหน้าหลักแบบเดียวกันทุกแบบฝึกหัด */
.home-back{display:inline-flex;align-items:center;gap:7px;margin:0 auto 18px;padding:9px 16px;background:#fff;border:1px solid #c6ddfa;border-radius:30px;color:#315f9e;text-decoration:none;font-family:Tahoma,sans-serif;font-size:14px;font-weight:bold;box-shadow:0 5px 15px #5b8bc21a;transition:.2s}
.home-back:hover{background:#79afea;color:#fff}
</style>
</head>
<body>
<a class="home-back" href="../index.html">← กลับหน้าหลัก</a>

    <div class="container">
        <div class="back-row">
            
        </div>

        <main class="bmi-card">
            <h1>คำนวณ BMI</h1>

            <div class="field">
                <label for="weight">น้ำหนัก (กก.):</label>
                <input type="number" id="weight" placeholder="กรอกน้ำหนัก">
            </div>

            <div class="field">
                <label for="height">ส่วนสูง (ซม.):</label>
                <input type="number" id="height" placeholder="กรอกส่วนสูง">
            </div>

            <button id="calc" type="button">คำนวณ</button>
            <div id="result" aria-live="polite"></div>
        </main>
    </div>

    <script>
        document.getElementById('calc').addEventListener('click', function() {
            const weightVal = document.getElementById('weight').value;
            const heightVal = document.getElementById('height').value;
            const resultDiv = document.getElementById('result');

            const weight = Number(weightVal);
            const height = Number(heightVal);

            if (!weightVal || !heightVal || weight <= 0 || height <= 0) {
                resultDiv.textContent = 'กรุณากรอกน้ำหนักและส่วนสูง';
                return;
            }

            const heightInMeters = height / 100;
            const rawBMI = weight / (heightInMeters * heightInMeters);

            let group = '';
            if (rawBMI < 18.5) {
                group = 'น้ำหนักน้อย';
            } else if (rawBMI < 25) {
                group = 'ปกติ';
            } else {
                group = 'น้ำหนักเกิน';
            }

            resultDiv.textContent = `BMI ${rawBMI.toFixed(1)} (${group})`;
        });
    </script>
</body>
</html>
