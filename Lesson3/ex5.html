<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องคิด BMI | Lesson 3</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --blue: #79afea;
            --dark: #315f9e;
            --text: #40516f;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            padding: 28px 14px 42px;
            color: var(--text);
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #edf7ff, #dceeff 55%, #f7fbff);
        }
        .page-wrap { width: min(100%, 760px); margin: 0 auto; }
        .top-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .nav-link-custom {
            display: inline-block;
            padding: 9px 16px;
            color: var(--dark);
            background: #fff;
            border: 1px solid #c6ddfa;
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 5px 15px #5b8bc21a;
        }
        .nav-link-custom:hover { color: #fff; background: var(--blue); }
        .bmi-card {
            padding: 28px;
            background: #ffffffed;
            border: 1px solid #d9eaff;
            border-radius: 24px;
            box-shadow: 0 12px 30px #5b8bc21f;
        }
        h1 { color: var(--dark); font-weight: 700; }
        .form-label { color: var(--dark); font-weight: bold; }
        .form-control {
            padding: 12px 14px;
            border-color: #c6ddfa;
            border-radius: 12px;
        }
        .form-control:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 .2rem #79afea33;
        }
        #calc {
            padding: 11px 25px;
            color: #fff;
            background: var(--blue);
            border: 0;
            border-radius: 30px;
            font-weight: bold;
        }
        #calc:hover { background: var(--dark); }
        #result {
            min-height: 52px;
            margin-top: 20px;
            padding: 13px;
            color: var(--dark);
            background: #f1f7ff;
            border: 1px solid #d9eaff;
            border-radius: 13px;
            font-size: 18px;
            font-weight: bold;
        }
        @media (max-width: 576px) {
            body { padding: 18px 10px 30px; }
            .bmi-card { padding: 20px 16px; }
            .top-nav { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <nav class="top-nav" aria-label="เมนูนำทาง">
            <a class="nav-link-custom" href="../index.html">← กลับหน้าแรก</a>
            <div class="d-flex flex-wrap gap-2">
                <a class="nav-link-custom" href="ex4.html">← แบบฝึกหัดก่อนหน้า</a>
                <a class="nav-link-custom" href="../Lesson2/ex6.html">บทเรียนก่อนหน้า</a>
            </div>
        </nav>

        <main class="bmi-card">
            <div class="text-center mb-4">
                <span class="badge rounded-pill text-bg-light border mb-2">LESSON 03 · EXERCISE 05</span>
                <h1 class="h2 mb-2">เครื่องคิด BMI</h1>
                <p class="text-secondary mb-0">คำนวณดัชนีมวลกายจากน้ำหนักและส่วนสูง</p>
            </div>

            <div class="mb-3">
                <label class="form-label" for="weight">น้ำหนัก (กิโลกรัม)</label>
                <input class="form-control" type="number" id="weight" min="0" step="any" placeholder="เช่น 60">
            </div>

            <div class="mb-4">
                <label class="form-label" for="height">ส่วนสูง (เซนติเมตร)</label>
                <input class="form-control" type="number" id="height" min="0" step="any" placeholder="เช่น 170">
            </div>

            <div class="d-grid">
                <button id="calc" type="button" class="btn">คำนวณ BMI</button>
            </div>

            <div id="result" class="text-center" role="status" aria-live="polite">
                กรุณากรอกน้ำหนักและส่วนสูง
            </div>
        </main>
    </div>

    <script>
        const weightInput = document.getElementById('weight');
        const heightInput = document.getElementById('height');
        const resultDiv = document.getElementById('result');

        document.getElementById('calc').addEventListener('click', function () {
            const weightValue = weightInput.value.trim();
            const heightValue = heightInput.value.trim();

            if (weightValue === '' || heightValue === '') {
                resultDiv.textContent = 'กรุณากรอกน้ำหนักและส่วนสูง';
                return;
            }

            const weight = Number(weightValue);
            const height = Number(heightValue);

            if (!Number.isFinite(weight) || !Number.isFinite(height) || weight <= 0 || height <= 0) {
                resultDiv.textContent = 'กรุณากรอกน้ำหนักและส่วนสูงให้ถูกต้อง';
                return;
            }

            const heightInMeters = height / 100;
            const bmi = weight / (heightInMeters * heightInMeters);

            let category = '';
            if (bmi < 18.5) {
                category = 'น้ำหนักน้อย';
            } else if (bmi < 25) {
                category = 'ปกติ';
            } else {
                category = 'น้ำหนักเกิน';
            }

            resultDiv.textContent = 'BMI ' + bmi.toFixed(1) + ' (' + category + ')';
        });
    </script>
</body>
</html>
