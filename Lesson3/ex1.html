<!DOCTYPE html>

<head><meta charset="UTF-8"><title>JS ตัวแรก</title></head>
<body>
  <a href="../index.html" style="display:inline-block;margin:12px;padding:10px 18px;background:#dceeff;color:#315f9e;border:1px solid #b9d8ff;border-radius:24px;text-decoration:none;font-family:Tahoma,sans-serif;font-weight:bold;">← กลับหน้าหลัก</a>

    <h1>ร้านกาแฟแมวเหมียว</h1>

    <script>
        const shop = "ร้านกาแฟแมวเหมียว";   // ไม่เปลี่ยน
        let cups = 3;                        // เปลี่ยนได้

        console.log("ร้าน: " + shop);
        console.log("ขายไปแล้ว " + cups + " แก้ว");

        cups = cups + 1;
        console.log("ตอนนี้ " + cups + " แก้ว");   // ตอนนี้ 4 แก้ว
    </script>
</body>
