<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <a href="../index.html" style="display:inline-block;margin:12px;padding:10px 18px;background:#dceeff;color:#315f9e;border:1px solid #b9d8ff;border-radius:24px;text-decoration:none;font-family:Tahoma,sans-serif;font-weight:bold;">← กลับหน้าหลัก</a>

    <button id="shake">เขย่าเซียมซี</button>
<p id="fortune"></p>

<script>
    const fortunes = ["โชคดีมาก", "โชคดี", "เฉยๆ", "ระวังตัว", "รอก่อน"];

    document.getElementById("shake").addEventListener("click", function () {
        const i = Math.floor(Math.random() * fortunes.length);   // 0–4
        document.getElementById("fortune").textContent = "ใบที่ " + (i + 1) + ": " + fortunes[i];
    });

    // สลับโหมดกลางคืน
    // document.body.classList.toggle("dark");
</script>
</body>
</html>
