<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณราคารวม</title>
<style>
:root{--blue:#79afea;--dark:#315f9e;--text:#40516f}*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;padding:24px 16px 42px;color:var(--text);font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#edf7ff,#dceeff 55%,#f7fbff);line-height:1.7}
body>*{max-width:900px;margin-left:auto;margin-right:auto}
body>a:first-child{display:inline-block!important;margin:0 auto 20px!important;padding:9px 16px!important;background:#fff!important;color:var(--dark)!important;border:1px solid #c6ddfa!important;border-radius:30px!important;text-decoration:none!important;font-family:Tahoma,sans-serif!important;font-weight:bold!important;box-shadow:0 5px 15px #5b8bc21a}
body>a:first-child:hover{background:var(--blue)!important;color:white!important}
h1,h2,h3{color:var(--dark);line-height:1.35}h1{font-size:clamp(28px,5vw,42px)}h2{font-size:24px}
main{max-width:560px;background:#ffffffed;border:1px solid #d9eaff;border-radius:22px;padding:26px;box-shadow:0 12px 30px #5b8bc21f;margin:14px auto;text-align:center}
.price-line,.total-line{background:#f4f9ff;border:1px solid #d9eaff;border-radius:14px;padding:14px;margin:14px 0}
input{width:100%;max-width:180px;padding:11px 13px;border:1px solid #c6ddfa;border-radius:11px;background:#fff;color:var(--text);font:inherit;text-align:center}
label{display:block;font-weight:bold;color:var(--dark);margin:12px 0 6px}
.total-line{font-size:20px;font-weight:bold;color:var(--dark)}
@media(max-width:600px){body{padding:16px 11px 30px}main{padding:18px}}
</style>
</head>
<body>
  <a href="../index.html" style="display:inline-block;margin:12px;padding:10px 18px;background:#dceeff;color:#315f9e;border:1px solid #b9d8ff;border-radius:24px;text-decoration:none;font-family:Tahoma,sans-serif;font-weight:bold;">← กลับหน้าหลัก</a>

  <main>
    <h1>คำนวณราคารวม</h1>
    <p class="price-line">ราคา <strong><span id="price">45</span></strong> บาท</p>
    <label for="qty">จำนวนสินค้า</label>
    <input id="qty" type="number" min="0" value="3">
    <p class="total-line" id="total">รวม 135 บาท</p>
  </main>

<script>
    const price = Number(document.getElementById("price").textContent);
    const qtyInput = document.getElementById("qty");
    const total = document.getElementById("total");

    function calculateTotal() {
        const qty = Math.max(0, Number(qtyInput.value) || 0);
        total.textContent = "รวม " + (price * qty) + " บาท";
    }

    calculateTotal();
    qtyInput.addEventListener("input", calculateTotal);
</script>
</body>
</html>
