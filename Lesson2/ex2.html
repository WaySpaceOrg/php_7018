<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูอาหาร</title>
</head>
<body>
    <table>
    <caption>เมนูอาหาร</caption>
    <thead>
        <tr>
            <!-- หัวตาราง 3 ช่อง -->
          <th>เมนู</th>
          <th>ร้อน</th>
          <th>เย็ฯ</th>
        </tr>
    </thead>
    <tbody>
        <tr><td>ลาเต้</td><td>50</td><td>60</td></tr>
        <!-- เพิ่มอีกอย่างน้อย 3 แถว หนึ่งในนั้นคือน้ำเปล่า -->
      	<tr>
          <td>น้ำเปล่า</td>
          <td colspan="2">10</td>
        </tr>
      	<tr>
          <td>คาปูชิโน่</td>
          <td>60</td>
          <td>70</td>
        </tr>
      	<tr>
          <td>อเมริกาโน่</td>
          <td>30</td>
          <td>50</td>
        </tr>
    </tbody>
    <!-- tfoot -->
  <tfoot><tr><td colspan="3"> เพิ่มช็อตกาแฟ = 15 บาท</td></tr> </tfoot>
</table>

</body>
</html>
